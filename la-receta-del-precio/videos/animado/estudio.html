<html lang="es"><head><meta charset="utf-8">
<title>Estudio Doña Marga</title>
<style>
@font-face{font-family:'T';src:url(../../fonts/Bric-XB-Cond.ttf)}
@font-face{font-family:'A';src:url(../../fonts/Fraun-It-SB.ttf);font-style:italic}
@font-face{font-family:'M';src:url(../../fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:'B';src:url(../../fonts/Bric-B.ttf)}
:root{--cacao:#24140F;--harina:#F4EADB;--margen:#FF5A1F;--lima:#C8F03C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--harina)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--harina)}
#world{position:absolute;inset:0;transform-origin:50% 55%}
#bgA{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 75%,#EADCC6 0,#F4EADB 70%)}
#bgC{position:absolute;inset:0;opacity:0;background-color:var(--cacao);
  background-image:linear-gradient(rgba(244,234,219,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(244,234,219,.06) 2px,transparent 2px);
  background-size:72px 72px}
svg.full{position:absolute;left:0;top:0;width:1080px;height:1920px}
.ov{position:absolute;left:64px;right:64px;opacity:0}
#hook{top:230px;background:var(--cacao);color:var(--harina);border-radius:26px;padding:40px 46px 48px;font:124px/0.92 'T';letter-spacing:-1px;box-shadow:0 30px 60px -30px rgba(36,20,15,.6)}
#hook em{font-style:normal;color:var(--margen)}
#prom{top:250px;text-align:center}
#prom span{display:inline-block;background:var(--margen);color:var(--cacao);font:40px 'M';letter-spacing:2px;padding:16px 32px;border-radius:99px}
#paso{top:250px;right:auto;font:34px 'M';background:var(--cacao);color:var(--harina);padding:10px 22px;border-radius:12px}
#card{top:250px;background:#FFFDF8;border-radius:24px;padding:26px 40px 30px;color:var(--cacao);box-shadow:0 26px 52px -26px rgba(36,20,15,.5)}
#card .k{display:flex;justify-content:space-between;font:26px 'M';letter-spacing:3px;color:#8C7F74;margin-bottom:10px}
#card .k b{color:var(--margen);font-weight:400}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:10px 0;border-bottom:3px dashed #E2D5C2}
.row:last-child{border-bottom:0}
.row .l{font:46px/1.1 'B'}
.row .v{font:54px 'M';color:var(--margen);white-space:nowrap}
.calc .lab{font:40px 'B';color:#8C7F74;margin-bottom:8px}
.calc .ln{font:58px/1.25 'M';display:flex;flex-wrap:wrap;gap:0 16px;align-items:baseline}
.calc .ln span{display:inline-block}
.calc .ln .op{color:#8C7F74}
.calc .ln .res{color:var(--margen);font-size:1.25em}
#card.big{background:var(--harina);top:300px}
#card.big .row .l{font-size:54px}#card.big .row .v{font-size:66px}#card.big .calc .ln{font-size:68px}
#big{top:250px;display:flex;justify-content:center}
#big .in{background:var(--cacao);color:var(--harina);border-radius:28px;padding:24px 40px 30px;text-align:center;box-shadow:0 30px 60px -28px rgba(36,20,15,.7)}
#big .l{font:30px 'M';letter-spacing:4px;color:#d8c9b6}
#big .v{font:150px/1 'M';color:var(--margen);margin-top:8px;white-space:nowrap}
#cta{top:230px;text-align:center;color:var(--cacao)}
#cta .logo{width:220px;height:220px;margin:0 auto 24px;border-radius:50%;background:var(--cacao)}
#cta .n{font:94px/0.95 'T'}
#cta .n em{font:italic 94px 'A';color:var(--margen)}
#cta .book{width:360px;height:480px;margin:0 auto 34px;perspective:1400px}
#cta .cover{width:100%;height:100%;background:var(--cacao);color:var(--harina);border-radius:10px 22px 22px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transform:rotateY(-16deg) rotateX(3deg);
  box-shadow:inset 18px 0 0 #3B2219,inset 22px 0 0 #6B3E2E,26px 34px 50px -18px rgba(36,20,15,.65)}
#cta .kk{font:26px 'M';letter-spacing:8px;background:var(--margen);color:var(--cacao);padding:6px 16px;border-radius:6px}
#cta .bt{font:66px/0.95 'T';text-align:center}
#cta .bt em{font:italic 66px 'A';color:var(--margen)}
#cta .bs{font:20px/1.5 'M';letter-spacing:2px;color:#d8c9b6;text-align:center}
#cta .h{display:inline-block;margin-top:28px;font:44px 'M';background:var(--margen);padding:16px 36px;border-radius:99px}
#cta .r{margin-top:20px;font:30px 'M';color:#8C7F74}
#caps{position:absolute;left:50px;right:50px;text-align:center;font:92px/1.02 'T';color:#fff;letter-spacing:-.5px;opacity:0;
  text-shadow:5px 0 #24140F,-5px 0 #24140F,0 5px #24140F,0 -5px #24140F,4px 4px #24140F,-4px 4px #24140F,4px -4px #24140F,-4px -4px #24140F,0 12px 0 rgba(36,20,15,.35)}
#caps .w{display:inline-block;margin:0 .16em}
#caps .w.n{color:var(--margen)}
#caps .w.on{color:var(--lima);transform:scale(1.1)}
#hook.glitch{text-shadow:-7px 0 #FF5A1F,7px 0 #C8F03C}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#bar{position:absolute;left:0;top:0;height:12px;background:var(--margen);width:0}
#bug{position:absolute;top:140px;right:60px;width:92px;height:92px;border-radius:50%;background:var(--cacao)}
</style></head>

<script>
const $ = s => document.querySelector(s), E = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const acts = s => Array.isArray(s.accion) ? s.accion : (s.accion ? [s.accion] : []);

// Planos: personaje [x, y, escala] y posición de subtítulos
const SHOTS = {
  A: {ch: [540, 1440, 1.06], bg: 0, caps: {top: 890, left: 40, right: 40, size: 112, align: 'center'}},
  B: {ch: [540, 1580, 1.85], bg: 0, caps: {top: 680, left: 40, right: 40, size: 116, align: 'center'}},
  C: {ch: [250, 1655, 0.62], bg: 1, pip: 1, big: 1, caps: {top: 1180, left: 490, right: 36, size: 92, align: 'left'}},
  D: {ch: [330, 1500, 1.0], bg: 0, caps: {top: 1100, left: 560, right: 36, size: 92, align: 'left'}},
};
let TL;

window.load = (tl) => {
  TL = tl;
  const P = E('parts'); let h = '';
  for (let i = 0; i < 26; i++){
    const c = ['#FF5A1F', '#C8F03C', '#F4EADB', '#FFD028'][i % 4];
    h += i % 3 === 0
      ? `<g id="pt${i}"><path d="M0 0 L26 0 A26 26 0 0 1 13 22.5 Z" fill="${c}"/></g>`
      : `<g id="pt${i}"><circle r="15" fill="#FFD028" stroke="#C99A00" stroke-width="4"/><text y="7" text-anchor="middle" font-family="M" font-size="20" fill="#7a5a00">$</text></g>`;
  }
  P.innerHTML = h;
  const S = TL.segmentos;
  S.forEach((s, i) => { s.next = i + 1 < S.length ? S[i + 1].ini : TL.duracion; s.acts = acts(s); });
  S.forEach(s => {
    s.grupos = []; let g = [];
    (s.palabras || []).forEach(w => {
      g.push(w);
      if (g.length >= 3 || /[.,:;?!…]$/.test(w[0])) { s.grupos.push(g); g = []; }
    });
    if (g.length) s.grupos.push(g);
  });
  const cta = S.flatMap(s => s.acts).find(a => a.tipo === 'cta');
  if (cta){ $('#cta .h').textContent = '↑ ' + (cta.boton || 'Link en mi perfil'); $('#cta .r').textContent = '@larecetadelprecio'; }
};

function segAt(t){
  const S = TL.segmentos; let k = 0;
  for (let i = 0; i < S.length; i++) if (t >= S[i].ini - .02) k = i;
  return S[k];
}
function vis(el, o, ty = 0, sc = 1, rot = 0){
  el.style.opacity = o;
  el.style.transform = `translateY(${ty}px) scale(${sc}) rotate(${rot}deg)`;
}
// cuenta animada: "$ 23.800" sube desde 0
function contar(valor, p){
  const m = valor.match(/^(\D*?)(\d[\d.]*)(,\d+)?(\D*)$/);
  if (!m) return valor;
  p = clamp(p);
  const n = parseInt(m[2].replace(/\./g, ''), 10), x = Math.round(n * easeOut(p));
  const s = x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return m[1] + s + (m[3] ? (p >= 1 ? m[3] : ',' + '0'.repeat(m[3].length - 1)) : '') + m[4];
}

let lastCard = null;
function pintarCard(s, a, shot){
  const card = E('card'), key = s.ini + a.tipo;
  if (lastCard !== key){
    lastCard = key;
    const paso = s.acts.find(x => x.tipo === 'paso');
    let h = `<div class="k"><span>${paso ? 'PASO <b>' + paso.k + '</b>' : ''}</span><span>EJEMPLO</span></div>`;
    if (a.tipo === 'rows'){
      h += a.rows.map(r => `<div class="row"><span class="l">${esc(r.label || '→')}</span><span class="v" data-v="${esc(r.valor)}"></span></div>`).join('');
    } else {
      const toks = a.linea.split(/\s*(=|÷|×|−|\+|\(|\))\s*/).filter(x => x && x.trim());
      let res = false;
      h += `<div class="calc">${a.label ? `<div class="lab">${esc(a.label)}</div>` : ''}<div class="ln">` +
        toks.map(x => { const op = /^(=|÷|×|−|\+|\(|\))$/.test(x), r = res; if (x === '=') res = true;
          return `<span class="${op ? 'op' : (r ? 'res' : '')}">${esc(x)}</span>`; }).join('') + '</div></div>';
    }
    card.innerHTML = h;
    card.classList.toggle('big', !!SHOTS[shot].big);
  }
  const dur = Math.max(.8, s.next - s.ini), t = TL.t - s.ini;
  if (a.tipo === 'rows'){
    const rs = card.querySelectorAll('.row'), step = Math.min(.9, dur * .7 / rs.length);
    rs.forEach((r, i) => {
      const p = (t - i * step) / .3;
      r.style.opacity = clamp(p); r.style.transform = `translateX(${(1 - easeOut(p)) * -50}px)`;
      const v = r.querySelector('.v'); v.textContent = contar(v.dataset.v, (t - i * step) / .55);
    });
  } else {
    const sp = card.querySelectorAll('.ln span'), step = Math.min(.35, dur * .7 / sp.length);
    sp.forEach((x, i) => { const p = (t - .1 - i * step) / .18; x.style.opacity = clamp(p); x.style.transform = `scale(${.6 + .4 * back(p)})`; });
  }
}

window.render = (t) => {
  TL.t = t;
  const f = Math.floor(t * TL.fps), o = TL.boca[f] || 0;
  const s = segAt(t), shot = s.plano || 'A', SH = SHOTS[shot];
  const ts = t - s.ini, dur = s.next - s.ini, prog = clamp(ts / dur);

  // corte con golpe de zoom
  const jc = Math.floor(ts / 1.7), jcOk = jc >= 1 && (s.next - (s.ini + jc * 1.7)) > .6 ? jc : 0;
  const tj = ts - jcOk * 1.7;
  let zoom = (jcOk % 2 ? 1.075 : 1) * (1 + (jcOk ? .035 : .07) * (1 - easeOut(tj / .2)));
  if (s.gancho && jcOk === 0) zoom = 1;
  const bt = t % .6, pulse = 1 + .011 * Math.exp(-bt / .09);
  let sx = 0, sy = 0;
  const wOn = (s.palabras || []).find(w => t >= w[1] && t < w[2]);
  if (wOn && /\d|\$|%/.test(wOn[0]) && t - wOn[1] < .16){ sx = Math.sin(t * 120) * 5; sy = Math.cos(t * 97) * 4; }
  E('world').style.transform = `translate(${sx}px,${sy}px) scale(${zoom * pulse})`;
  E('flash').style.opacity = s.gancho ? .55 * (1 - easeOut(ts / .1)) * (ts > .02 ? 1 : 0) : (ts < .07 && s.plano !== segAt(s.ini - .05).plano ? .25 : 0);
  E('bgC').style.opacity = SH.bg; E('bgA').style.opacity = 1 - SH.bg; E('deco').style.opacity = SH.bg ? 0 : 1;
  [['d1', 900, 520, 18], ['d2', 140, 820, -24], ['d3', 960, 1180, 30]].forEach(([id, x, y, sp]) =>
    E(id).setAttribute('transform', `translate(${x} ${y}) rotate(${t * sp * 1.6}) scale(${pulse * 1.02})`));

  // cámara sobre Doña Marga, con acercamiento lento dentro del plano
  let [cx, cy, sc] = SH.ch;
  let drift = shot === 'B' ? 1 + .05 * prog : 1 + .02 * prog;
  if (s.gancho){ drift *= 1 + .22 * (1 - easeOut(ts / .6)); cy += 40 * (1 - easeOut(ts / .6)); }
  if (shot === 'D') cx += 12 * prog;
  E('char').setAttribute('transform', `translate(${cx} ${cy}) scale(${sc * drift})`);
  if (SH.pip) E('clipwrap').setAttribute('clip-path', 'url(#pip)'); else E('clipwrap').removeAttribute('clip-path');
  E('pipbg').setAttribute('opacity', SH.pip ? 1 : 0); E('pipring').setAttribute('opacity', SH.pip ? 1 : 0);

  const sway = 1.8 * Math.sin(t * 1.4) + o * 2.6 * Math.sin(t * 7);
  E('head').setAttribute('transform', `translate(0 ${-o * 5}) rotate(${sway} 0 180)`);
  E('body').setAttribute('transform', `translate(0 ${Math.sin(t * 2.4) * 3})`);
  const bp = (t + .7) % 3.1, blink = bp < .13 ? Math.sin(bp / .13 * Math.PI) : 0;
  E('eyeL').setAttribute('transform', `translate(-80 -8) scale(1 ${1 - .9 * blink})`);
  E('eyeR').setAttribute('transform', `translate(80 -8) scale(1 ${1 - .9 * blink})`);
  const ceja = s.ceja ? (s.gancho ? 1 : easeOut(ts / .2)) * (1 - easeOut((t - s.fin) / .25)) : 0, lift = -15 * ceja;
  // en el gancho: mirada escéptica (una ceja baja, la otra bien arriba)
  const lL = s.gancho ? 6 * ceja : lift, lR = s.gancho ? -26 * ceja : lift;
  E('browL').setAttribute('d', `M-122 ${-72 + lL} Q-82 ${-96 + lL * 1.3} -40 ${-76 + lL * 1.6}`);
  E('browR').setAttribute('d', `M40 ${-76 + lR * .6} Q82 ${-96 + lR * 1.6} 122 ${-72 + lR * .6}`);
  const w = 92 + o * 8, h = 4 + o * 46;
  const d = `M${-w / 2} 0 Q0 ${-3 - o * 3} ${w / 2} 0 Q0 ${h * 1.55 + 16} ${-w / 2} 0 Z`;
  E('mouth').setAttribute('d', d); E('mclipPath').setAttribute('d', d);
  E('teeth').setAttribute('height', o > .2 ? 9 + o * 6 : 0);
  E('tongue').setAttribute('cy', h * 1.2 + 6); E('tongue').setAttribute('ry', o > .15 ? 10 + o * 14 : 0);
  E('lip').setAttribute('d', `M${-w / 2 - 4} 2 Q0 ${h * 1.55 + 20} ${w / 2 + 4} 2`);

  // motion graphics del segmento
  ['hook', 'prom', 'paso', 'card', 'big', 'cta'].forEach(id => E(id).style.opacity = 0);
  const A = s.acts;
  const hook = A.find(a => a.tipo === 'hook'), card = A.find(a => a.tipo === 'rows' || a.tipo === 'calc');
  const big = A.find(a => a.tipo === 'big'), cta = A.find(a => a.tipo === 'cta');
  const paso = A.find(a => a.tipo === 'paso'), prom = A.find(a => a.tipo === 'promesa');
  if (hook){
    E('hook').innerHTML = esc(hook.texto).replace(/\*([^*]+)\*/g, '<em>$1</em>');
    const p = ts / .28, shake = ts > .28 && ts < .5 ? Math.sin(ts * 90) * 6 * (1 - (ts - .28) / .22) : 0;
    vis(E('hook'), 1, shake, 1.1 - .1 * easeOut(p), -2 + 1 * easeOut(p));
    const gl = (ts > .05 && ts < .17) || (ts > 1.25 && ts < 1.33) || (ts > 2.1 && ts < 2.16);
    E('hook').classList.toggle('glitch', gl);
    if (gl) E('hook').style.transform += ` translateX(${Math.sin(ts * 300) * 10}px)`;
  }
  if (prom){ const p = ts / .3; vis(E('prom'), clamp(p * 2), 0, (.7 + .3 * back(p)) * (1 + .03 * Math.sin(ts * 9))); }
  if (card){ pintarCard(s, card, shot); const p = ts / .3; vis(E('card'), clamp(p * 2), (1 - easeOut(p)) * 50); }
  else if (paso){ E('paso').textContent = 'PASO ' + paso.k; const p = ts / .25; vis(E('paso'), clamp(p * 2), 0, .6 + .4 * back(p)); }
  if (big){
    const t0 = Math.min(1.2, dur * .3), p = (ts - t0) / .45;
    $('#big .l').textContent = big.label;
    const v = $('#big .v'); v.style.fontSize = Math.min(150, 880 / (.6 * big.valor.length)) + 'px';
    v.textContent = contar(big.valor, (ts - t0) / .6);
    vis(E('big'), ts < t0 ? 0 : clamp(p * 3), 0, .4 + .6 * back(p), -3);
  }
  if (cta){
    const p = ts / .5;
    vis(E('cta'), clamp(p * 2), 0, .8 + .2 * back(p));
    E('ctasym').setAttribute('transform', `translate(110 110) rotate(${(1 - easeOut(p)) * -180}) scale(.29) translate(0 -56)`);
    $('#cta .h').style.transform = `scale(${1 + .05 * Math.sin(ts * 8)}) translateY(${-Math.abs(Math.sin(ts * 5)) * 10}px)`;
    $('#cta .cover').style.transform = `rotateY(${-16 + 10 * Math.sin(ts * 1.6)}deg) rotateX(3deg)`;
  }

  // subtítulos palabra por palabra
  const caps = E('caps'), C = SH.caps;
  Object.assign(caps.style, {top: C.top + 'px', left: C.left + 'px', right: C.right + 'px', textAlign: C.align, fontSize: C.size + 'px'});
  const g = s.grupos.find(gr => t >= gr[0][1] - .03 && t < gr[gr.length - 1][2] + .12) ||
            (t <= s.fin + .15 ? s.grupos.filter(gr => gr[0][1] <= t).slice(-1)[0] : null);
  if (g && !cta){
    caps.innerHTML = g.map(w => {
      const on = t >= w[1] && t < w[2], num = /\d|\$|%/.test(w[0]);
      return `<span class="w${on ? ' on' : ''}${num && !on ? ' n' : ''}">${esc(w[0])}</span>`;
    }).join(' ');
    caps.style.opacity = 1; caps.style.transform = `scale(${.86 + .14 * easeOut((t - g[0][1]) / .12)})`;
  } else caps.style.opacity = 0;

  // marcador: círculo dibujado a mano sobre el resultado
  const mk = E('marker'); mk.setAttribute('opacity', 0);
  let tgt = null, tm = 0;
  if (card){ const vs = E('card').querySelectorAll('.row .v, .ln .res'); tgt = vs[vs.length - 1]; tm = Math.min(dur * .62, dur - .5); }
  if (big){ tgt = $('#big .v'); tm = Math.min(1.2, dur * .3) + .7; }
  if (tgt && ts > tm && tgt.textContent){
    const r = tgt.getBoundingClientRect(), p = easeOut((ts - tm) / .35);
    const rx = r.width / 2 + 30, ry = r.height / 2 + 18, c = 2 * Math.PI * Math.max(rx, ry);
    mk.setAttribute('cx', r.left + r.width / 2); mk.setAttribute('cy', r.top + r.height / 2);
    mk.setAttribute('rx', rx); mk.setAttribute('ry', ry);
    mk.setAttribute('transform', `rotate(-4 ${r.left + r.width / 2} ${r.top + r.height / 2})`);
    mk.setAttribute('stroke-dasharray', c); mk.setAttribute('stroke-dashoffset', c * (1 - p));
    mk.setAttribute('opacity', 1);
  }
  // lluvia de monedas y porciones cuando cae el dato
  for (let i = 0; i < 26; i++){
    const el = E('pt' + i);
    if (!big){ el.setAttribute('opacity', 0); continue; }
    const t0 = Math.min(1.2, dur * .3), tp = ts - t0;
    if (tp < 0 || tp > 2.2){ el.setAttribute('opacity', 0); continue; }
    const a = (i / 26) * Math.PI * 2 + i * .7, v = 380 + (i * 137 % 360);
    const x = 540 + Math.cos(a) * v * tp, y = 420 + (Math.sin(a) * v - 350) * tp + 620 * tp * tp;
    el.setAttribute('transform', `translate(${x} ${y}) rotate(${tp * (200 + i * 40)}) scale(${1.1 - tp * .2})`);
    el.setAttribute('opacity', clamp(2.2 - tp));
  }
  E('bar').style.width = (100 * clamp(t / TL.duracion)) + '%';
};
</script>
</body></html>
