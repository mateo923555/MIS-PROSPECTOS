<!doctype html><meta charset=utf-8><style>
@font-face{font-family:F;src:url(fredoka-latin-700-normal.woff2)}
*{margin:0;box-sizing:border-box}body{width:2560px;height:1440px;overflow:hidden;position:relative;font-family:F}
.abs{position:absolute}img.abs{display:block}
.title{position:absolute;color:#F3E7C9;text-shadow:0 8px 0 #F2705B,0 16px 0 #123C40,0 24px 30px #0006;white-space:nowrap;line-height:1}
.title span{color:#F6C945}
.pill{position:absolute;background:#F2705B;color:#fff;padding:6px 34px;border-radius:50px;box-shadow:0 6px 0 #123C40;text-shadow:0 4px 0 #123C40;white-space:nowrap;letter-spacing:2px}
.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#2a3d47 0%,#16252d 55%,#0c1519 100%)}
.cone{position:absolute;left:1040px;top:-40px;width:480px;height:1100px;background:linear-gradient(#fff0,#ffe9a888 85%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.lamp{position:absolute;left:1215px;top:-20px;width:130px;height:80px;background:#F6C945;border-radius:65px 65px 0 0;box-shadow:0 10px 0 #b8901e}
.cord{position:absolute;left:1277px;top:-100px;width:6px;height:90px;background:#aaa}
.floor{position:absolute;left:0;right:0;bottom:0;height:560px;background:linear-gradient(#26343b,#101a1f);}
.table{position:absolute;left:760px;top:915px;width:1040px;height:46px;background:#9c6b3f;border-radius:12px;box-shadow:0 14px 0 #6e4825,0 40px 40px #0008}
.tape{position:absolute;left:-100px;top:985px;width:2800px;height:90px;background:repeating-linear-gradient(-45deg,#F6C945 0 50px,#16282B 50px 100px);transform:rotate(-1.2deg);box-shadow:0 8px 20px #0008}
.sh{position:absolute;height:40px;border-radius:50%;background:#0009;filter:blur(7px)}
.star{position:absolute;color:#F6C945}</style>
