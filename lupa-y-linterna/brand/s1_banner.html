<!doctype html><meta charset=utf-8><style>
@font-face{font-family:F;src:url(fredoka-latin-700-normal.woff2)}
*{margin:0;box-sizing:border-box}body{width:2560px;height:1440px;overflow:hidden;position:relative;font-family:F}
.abs{position:absolute}img.abs{display:block}
.title{position:absolute;color:#F3E7C9;text-shadow:0 8px 0 #F2705B,0 16px 0 #123C40,0 24px 30px #0006;white-space:nowrap;line-height:1}
.title span{color:#F6C945}
.pill{position:absolute;background:#F2705B;color:#fff;padding:6px 34px;border-radius:50px;box-shadow:0 6px 0 #123C40;text-shadow:0 4px 0 #123C40;white-space:nowrap;letter-spacing:2px}
.sh{position:absolute;height:40px;border-radius:50%;background:#0007;filter:blur(7px)}
.star{position:absolute;color:#F6C945;text-shadow:0 4px 0 #123C4066;line-height:1}
.bg{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 38% 62%,#FFD98A 0 7deg,#F6C945 7deg 14deg)}.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 38% 55%,#0000 35%,#b8761a66 100%)}
.rug{position:absolute;left:300px;top:880px;width:960px;height:150px;border-radius:50%;background:radial-gradient(ellipse,#E08E70,#C9735A 70%,#B05F4A);box-shadow:0 12px 30px #0005,inset 0 0 0 8px #ffe9d255}
.fl{position:absolute;left:150px;top:300px;width:300px;height:110px;background:#F2705B;border-radius:30px 12px 12px 30px;box-shadow:0 10px 0 #b04030,inset 0 -14px 0 #0002;transform:rotate(14deg);transform-origin:0 50%}
.fh{position:absolute;left:430px;top:268px;width:110px;height:170px;background:#F6C945;border-radius:12px 40px 40px 12px;box-shadow:0 10px 0 #b8901e;transform:rotate(14deg);transform-origin:-280px 82px}
.beam{position:absolute;left:520px;top:300px;width:900px;height:560px;background:linear-gradient(90deg,#fffd,#fff0);clip-path:polygon(0 38%,100% 0,100% 100%,0 62%);transform:rotate(14deg);transform-origin:0 50%;opacity:.55}
.bal{position:absolute;border-radius:50% 50% 48% 48%;box-shadow:inset -14px -18px 0 #0002,0 10px 20px #0003}
.str{position:absolute;width:4px;background:#fff9}</style><div class=bg></div><div class=vig></div>
